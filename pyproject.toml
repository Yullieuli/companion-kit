[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-kit"
version = "0.9.2"
description = "跨 agent 的伴侣运行时：一套人格、一套记忆、一套时钟"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yullieuli" }]
keywords = ["agent", "mcp", "llm", "companion", "persona", "memory", "onebot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Yullieuli/companion-kit"
Repository = "https://github.com/Yullieuli/companion-kit"
Issues = "https://github.com/Yullieuli/companion-kit/issues"
Changelog = "https://github.com/Yullieuli/companion-kit/blob/main/CHANGELOG.md"

[project.scripts]
companion = "companion.boot:main"

[tool.setuptools.packages.find]
where = ["src"]

# hermes 适配层不是 Python 包（是宿主侧的独立脚本），但 connect 要用它们。
# 不打进 wheel 的话，pip 装出来的用户跑 `companion connect hermes` 会找不到文件，
# 只有从源码目录跑的开发者能接 hermes —— 这正是"只有作者机器上能用"的经典坑。
[tool.setuptools.data-files]
"share/companion/hermes" = [
  "hermes/companion_hook.py",
  "hermes/companion_post.py",
  "hermes/companion_wake.py",
  "hermes/companion_shared.py",
  "hermes/companion_gate.py",
  "hermes/companion_watchdog.py",
  "hermes/patch_napcat_guard.py",
  "hermes/allowlist_hooks.py",
]
