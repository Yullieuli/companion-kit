[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-kit"
version = "0.3.1"
description = "跨 agent 的伴侣运行时：一套人格、一套记忆、一套时钟"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
companion = "companion.boot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
companion = ["templates/*.md"]
