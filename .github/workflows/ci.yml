name: ci

# 单测与安装演练分开：单测要快、要确定性；安装演练慢、依赖网络，
# 混在一起会让"代码坏了"和"网络抽风"分不清。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装（editable）
        run: python -m pip install -e .
      - name: 全量单测
        run: python -m unittest discover -s tests -v

  package:
    name: 打包 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: 构建
        run: python -m build --wheel --outdir dist
      - name: 干净 venv 安装并冒烟
        run: |
          python -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install --quiet dist/*.whl
          /tmp/ci-venv/bin/companion --home /tmp/ci-home init
          /tmp/ci-venv/bin/companion --home /tmp/ci-home context --budget 300
          /tmp/ci-venv/bin/companion --home /tmp/ci-home tick
          /tmp/ci-venv/bin/companion --home /tmp/ci-home cost
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  install:
    name: 安装演练 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shell 脚本语法检查
        if: runner.os != 'Windows'
        run: bash -n install.sh && bash -n hermes/install_hermes.sh
      - name: 从本地源安装（真实跑 install.sh）
        if: runner.os != 'Windows'
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          bash install.sh --from . --home "$HOME/.companion" --no-connect
          "$HOME/.companion/venv/bin/companion" --home "$HOME/.companion" context --budget 300
          "$HOME/.companion/venv/bin/companion" --home "$HOME/.companion" connect --status
      - name: PowerShell 脚本语法检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      # 之前这里只有语法检查，等于 Windows 的安装路径从没被真实执行过。
      # 而 Windows 恰恰是路径/编码/换行最容易出问题的那一端。
      - name: 从本地源安装（真实跑 install.ps1）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $store = Join-Path $env:RUNNER_TEMP "ck-store"
          ./install.ps1 -From . -Store $store -NoEnv -NoConnect
          $exe = Join-Path $store "venv\Scripts\companion.exe"
          & $exe --home $store context --budget 300
          if ($LASTEXITCODE -ne 0) { throw "context 失败" }
          & $exe --home $store connect --status
          if ($LASTEXITCODE -ne 0) { throw "connect 失败" }

  container:
    name: 容器内单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 test 阶段（构建时即跑全量单测）
        run: docker build --target test -t companion-kit:test .

  coverage:
    name: core 覆盖率守门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装（editable）
        run: python -m pip install -e .
      - run: python -m pip install coverage
      # SPEC §9：core 覆盖率 ≥ 90%。口径见 tests/test_coverage_gate.py 的注释：
      # 平台适配层（devwin/devcdp/bilinet）不计入——SPEC 明说"adapter 只测契约不测实现"。
      - name: 跑覆盖率并守门
        run: |
          python -m coverage run --source=src/companion -m unittest discover -s tests
          python -m coverage report --include="*/ask.py,*/clock.py,*/context.py,*/cost.py,*/drive.py,*/events.py,*/fence.py,*/group.py,*/guard.py,*/imgpng.py,*/initiative.py,*/life.py,*/memory.py,*/mood.py,*/mood_rules.py,*/opinion.py,*/people.py,*/quota.py,*/react.py,*/sticker.py,*/store.py"

